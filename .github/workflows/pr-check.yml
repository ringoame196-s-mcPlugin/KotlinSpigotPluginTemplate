name: Kotlin Lint, Detekt & Build Check

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'src/**/*.kt' # .kt ファイルの変更時のみ実行

jobs:
  build:
    if: github.event.pull_request.draft == false # Draft PR（下書き）は除外
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x ./gradlew

      # --- 🛡️ Detekt & Lint & Build ---
      # コード解析・フォーマット・ビルドチェックを一括実行
      - name: Detekt, Lint & Build
        run: |
          ./gradlew detekt lintKotlin build --parallel --build-cache --no-daemon

      # --- 🚀 Auto Merge ---
      # Detekt や Build が全て成功した場合のみ自動マージ
      - name: Auto Merge (Rebase)
        if: success() && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'Ringoame196'
        run: |
          curl -L \
            -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/merge \
            -d '{"merge_method": "merge"}'